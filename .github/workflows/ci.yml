name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked --extra dev --extra legacy --extra imaging --extra archives
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check src tests
      - name: Tests (offline; network tests are excluded by default)
        run: uv run pytest
